# Touchline API on Netlify: the Express app runs as one function (netlify/functions/api.js).
# Background jobs do not run here; see .github/workflows/jobs.yml (node worker.js).

[build]
  publish = "public"
  command = "echo 'no build step'"

[build.environment]
  NODE_VERSION = "22"
  # These keys hold plain settings whose values legitimately appear in code and docs.
  SECRETS_SCAN_OMIT_KEYS = "CLERK_PUBLISHABLE_KEY,VITE_CLERK_PUBLISHABLE_KEY,NODE_ENV,RUN_MIGRATIONS,STORAGE_DRIVER,S3_BUCKET_RAW,S3_REGION_OVERRIDE,STATSBOMB_SOURCE,STATSBOMB_COMPETITION_ALLOWLIST,CLERK_AUTHORIZED_PARTIES"
  SECRETS_SCAN_OMIT_PATHS = "tests/fixtures/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every path goes to the Express app.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
