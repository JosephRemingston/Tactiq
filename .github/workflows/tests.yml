name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: touchline
          POSTGRES_PASSWORD: touchline
          POSTGRES_DB: touchline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and end-to-end tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://touchline:touchline@localhost:5432/touchline_test
