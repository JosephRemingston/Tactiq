name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: tests never need to write to the repository. No secrets are used, so forked pull
# requests run safely.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: touchline
          POSTGRES_PASSWORD: touchline
          POSTGRES_DB: touchline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit, integration and security tests with coverage
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://touchline:touchline@localhost:5432/touchline_test
