name: jobs

# Background work for the API: provider sync, match ingestion, analytics, insights, billing reconciliation.
# The API only writes rows to the ingestion_jobs table; this workflow runs `node worker.js` to process them.
on:
  schedule:
    - cron: "17 * * * *" # every hour: drain queued work (user re-analysis requests, retries, daily billing jobs)
    - cron: "40 3 * * *" # daily: also sync competitions and matches from the data provider
  workflow_dispatch:
    inputs:
      sync:
        description: "Sync competitions and matches from the provider first"
        type: boolean
        default: false

# The worker only reads the repository; production credentials come from secrets, never from the token.
permissions:
  contents: read

# One run at a time; a scheduled run never cancels one that is still working.
concurrency:
  group: tactiq-jobs
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER || 'neon' }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      # Plain settings, same values as .env.example; an unset variable would arrive as an empty string.
      S3_BUCKET_RAW: ${{ vars.S3_BUCKET_RAW || 'tactiq' }}
      S3_REGION_OVERRIDE: ${{ vars.S3_REGION_OVERRIDE || 'ap-southeast-1' }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      STATSBOMB_SOURCE: github
      STATSBOMB_COMPETITION_ALLOWLIST: ${{ vars.STATSBOMB_COMPETITION_ALLOWLIST || '43:106,43:3' }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      WORKER_BUDGET_MS: "1500000" # 25 minutes, inside the 30-minute job timeout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # No install scripts: the job holds production secrets, so no dependency gets to run code at install time.
      - run: npm ci --omit=dev --ignore-scripts
      - name: Run worker
        # Workflow expressions are passed through the environment, never pasted into the script.
        env:
          RUN_SCHEDULE: ${{ github.event.schedule }}
          RUN_SYNC: ${{ inputs.sync }}
        run: |
          if [ "$RUN_SCHEDULE" = "40 3 * * *" ] || [ "$RUN_SYNC" = "true" ]; then
            node worker.js --sync
          else
            node worker.js
          fi
